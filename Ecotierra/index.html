<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoHortalizas Bolivia</title>
    <meta name="description" content="Company dedicated to the production of organic vegetables in Bolivia">
    <meta name="description" content="Jazmin's Ecotierra Company's About Us Page">
    <meta name="author" content="Jazmin Ruiz">
    <link rel="stylesheet" href="styles/large.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@900&family=Source+Code+Pro&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/logo.png" alt="EcoHortalizas" />
            <h1>EcoHortalizas Bolivia</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Growing health, harvesting the future!</h2>
            <img src="images/huerto.jpg" alt="Organic garden" class="responsive-img" />
        </section>

        <section class="newsletter">
            <h3>Subscribe to our newsletter</h3>
            <form id="newsletterForm">
                <label for="nombre">Name:</label>
                <input type="text" id="nombre" name="nombre" required />

                <label for="correo">Email:</label>
                <input type="email" id="correo" name="correo" required />

                <button type="submit">Subscribe</button>
            </form>
            <p id="mensajeNewsletter"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 EcoHortalizas Bolivia</p>
        <div class="redes">
            <a href="#"><img src="images/facebook.png" alt="Facebook" width="40"></a>
            <a href="#"><img src="images/whatsapp.png" alt="WhatsApp" width="40"></a>
        </div>
    </footer>

    <script src="scripts/ecotierra.js"></script>
</body>

</html>
