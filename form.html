<body>
    <header>
        <img src="images/icon.svg" alt="my icon" id="jazminruiz">
        <span id="page-title">Product Review</span>

        
    </header>

    <main class="joingrid">
        <h1 class="h1small">Bolivian Chamber of Commerce <br>Join Us</h1>
        <form id="form" action="thankyou.html" method="GET" class="left dark1">
           <fieldset>
               <legend>Membership Application</legend>
              
                <label>First name *
                    <input type="text" name="fname" autocomplete="given-name" title="Enter your first name" required>
                </label>
                <label>Last name *
                    <input type="text" name="lname" autocomplete="family-name" title="Enter your last name" required>
                </label>
                <label>Organizational Title
                    <input type="text" name="title" autocomplete="organization-title" title="Enter your title that only can have alpha characters, hyphens, and spaces with a minimum of seven (7) characters"  pattern="^[A-Za-z\s\-]{7,}$">
                </label>
                <label>Email *
                    <input type="email" name="email" autocomplete="email" title="Enter your email" required>
                </label>
                <label>Cell Phone *
                    <input type="tel" name="phone" autocomplete="tel" title="Enter your cell phone" required>
                </label>
                <label>Business Name *
                    <input type="text" name="business" autocomplete="organization" title="Enter your business name" required>
                </label>
        
                <label>Select a Membership Level *
                    <select name="membership">
                        <option value="NP" title="NP Membership is for non profit organizations and there is no fee.">NP Membership</option>
                        <option value="Bronze Membership">Bronze Membership</option>
                        <option value="Silver Membership">Silver Membership</option>
                        <option value="Gold Membership">Gold Membership</option>
                    </select>
                </label>
                <label>
                    Business Description
                    <textarea name="bdescription" rows="5" title="Enter a description of your business"></textarea>
                </label>
                <label>
                    <input type="hidden" name="timestamp" id="timestamp">
                </label>
                <button id="button" type="submit">Get Membership</button>
            </fieldset>
        </form>
        

    </main>
    <footer>
