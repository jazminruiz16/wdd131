<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolivia Chamber of Commerce Directory</title>
    <meta name="description" content="Home Page of Chamber of Commerce of Bolivia">
    <meta name="author" content="Jazmin Ruiz">
    
    <link rel="stylesheet" href="styles/form-small.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@900&family=Source+Code+Pro&display=swap"
        rel="stylesheet">
    <script src="scripts/forms.js" defer></script>

</head>

<body>
    <header>
        
        <span id="page-title">Product Review</span>

        
    </header>

    <main class="joingrid">
        <h1 class="h1small">Product Review Form</h1>
        <form id="form" action="review.html" method="GET" class="left dark1">
           <fieldset>

                <label>Product Name
                    <select name="product" id="selectproduct" required>
                        <option value="Product not selected" title="Choose a product" disabled selected>Choose a product...</option>
                        
                    </select>
                </label>
                <div class="ratiooption">
                    <label>⭐
                        <input type="radio" name="rating" value="1 star">
                    </label>
                    <label>⭐⭐
                        <input type="radio" name="rating" value="2 stars">
                    </label>
                    <label>⭐⭐⭐
                        <input type="radio" name="rating" value="3 stars">
                    </label>
                    <label>⭐⭐⭐⭐
                        <input type="radio" name="rating" value="4 stars">
                    </label>
                    <label>⭐⭐⭐⭐⭐
                        <input type="radio" name="rating" value="5 stars">
                    </label>
                </div>
                

                
                <label>Date of installation
                    <input type="date" name="date"  title="Enter the date of installation of your product" >
                </label>
                <p>Which features did you find useful in the product?<br>(Check all that apply)</p>
                <div class="checkbox">
                    <input type="checkbox" name="features" id="durability" value="Durability">
                    <label for="durability">Durability</label> 
                </div>
                <div class="checkbox">
                    <input type="checkbox" name="features" id="use" value="Ease of Use">
                    <label for="use">Ease of Use</label>
                </div>
                <div class="checkbox">
                    <input type="checkbox" name="features" id="performance" value="Performance">
                    <label for="performance">Performance</label>
                </div>
                <div class="checkbox">
                    <input type="checkbox" name="features" id="design" value="Design">
                    <label for="design">Design</label>
                </div>
                <label>
                    Written Review (Optional)
                    <textarea name="review" rows="5" title="Enter a review"></textarea>
                </label>

                
                <label>Your Name (Optional)
                    <input type="name" name="name" autocomplete="null" title="Enter your name" >
                </label>
                
                <button id="button" type="submit">Post Review</button>
                
            </fieldset>
        </form>
        

    </main>
    <footer>
        <footer>
            <p>© <span id="currentyear"></span> - Jazmin Ruiz - Bolivia</p>
            <p class="lastmodification">Last modification: <span id="lastModified"></span></p>
        </footer>
        <script src="scripts/filtered-temples.js" defer></script>

    </footer>
    
    <script src="scripts/modal.js" defer></script>
    
</body>

</html>
